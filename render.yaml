services:
  - type: web
    name: fii-dii-strategy
    env: node
    region: singapore
    buildCommand: python3 -m venv venv && ./venv/bin/pip install -r requirements.txt && npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
